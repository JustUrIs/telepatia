<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>telepatía · archivos por luz</title>
<link rel="stylesheet" href="./src/ui/instrument.css">
<link rel="manifest" href="./src/ui/manifest.webmanifest">
<meta name="theme-color" content="#f4f1e9">
<link rel="apple-touch-icon" href="./src/ui/icon.svg">
</head>
<body class="home">
<main class="portada">
  <header class="home-marca">
    <a class="logotipo" href="./">telepatía<span aria-hidden="true">.</span></a>
    <span class="modelo">AGP1</span>
  </header>
  <section class="home-hero">
    <p class="eyebrow">De una computadora aislada a otra</p>
    <h1>Pasá un archivo<br><em>por la luz.</em></h1>
    <p class="home-bajada">Sin pendrive. Sin internet. Sin abrir una puerta de vuelta.</p>
  </section>
  <nav class="puertas" aria-label="Elegir función">
    <a class="puerta" id="ir-emisor" href="./src/ui/sender.html">
      <span class="paso">01</span>
      <span><strong>Quiero enviar</strong><small>Elegir y mostrar el archivo</small></span>
      <span class="flecha" aria-hidden="true">→</span>
    </a>
    <a class="puerta puerta-camara" id="ir-receptor" href="./src/ui/receiver.html">
      <span class="paso">02</span>
      <span><strong>Quiero recibir</strong><small>Abrir la cámara y apuntar</small></span>
      <span class="flecha" aria-hidden="true">→</span>
    </a>
  </nav>
  <footer class="home-pie">
    <span class="pulso" aria-hidden="true"></span>
    <span id="offline">Preparando uso sin conexión…</span>
  </footer>
</main>
<script type="module">
  const estado = document.getElementById('offline');
  const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  if (location.protocol === 'http:' && !local) {
    const base = `https://${location.hostname}:8443`;
    document.getElementById('ir-emisor').href = `${base}/src/ui/sender.html`;
    document.getElementById('ir-receptor').href = `${base}/src/ui/receiver.html`;
  }
  if (!('serviceWorker' in navigator)) {
    estado.textContent = local
      ? 'Este navegador no permite instalar el modo sin conexión.'
      : 'Entrá por HTTPS para habilitar cámara y modo sin conexión.';
  } else {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(async () => {
        await navigator.serviceWorker.ready;
        estado.textContent = 'Listo para funcionar sin conexión.';
      })
      .catch(() => {
        estado.textContent = 'Entrá por HTTPS confiable para usarlo sin conexión.';
      });
  }
</script>
</body>
</html>
